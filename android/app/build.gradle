plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Endereço da API e (se existir o arquivo local, fora do git) a chave: já vêm configurados no APK, que fica só com você.
def keyFile = file('../../.secrets/prod_api_key.txt')
def defaultKey = keyFile.exists() ? keyFile.text.trim() : ''

android {
    namespace 'br.notixias.app'
    compileSdk 34

    defaultConfig {
        applicationId 'br.notixias.app'
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '0.1.12'
        buildConfigField 'String', 'DEFAULT_API_URL', '"https://notixias.163.176.176.10.nip.io"'
        buildConfigField 'String', 'DEFAULT_API_KEY', '"' + defaultKey + '"'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// O script que vai junto do app é o gerado em userscript/ (a cópia de fábrica; o app ainda baixa a mais nova do servidor).
tasks.register('copyUserscript', Copy) {
    from file('../../userscript/notixias.user.js')
    into file('src/main/assets')
}
preBuild.dependsOn 'copyUserscript'
